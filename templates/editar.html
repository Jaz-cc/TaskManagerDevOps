
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar tarea - TaskManager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <main class="container">
        <section class="formulario">
            <h1>Editar tarea</h1>
            <p>Modifica la información de tu actividad.</p>

            <form action="{{ url_for('editar', id=tarea.id) }}" method="POST">

                <label for="nombre">Nombre de la tarea</label>
                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    value="{{ tarea.nombre }}"
                    required
                >

                <label for="descripcion">Descripción</label>
                <textarea
                    id="descripcion"
                    name="descripcion"
                >{{ tarea.descripcion or '' }}</textarea>

                <label for="prioridad">Prioridad</label>
                <select id="prioridad" name="prioridad" required>
                    <option value="Alta" {% if tarea.prioridad == 'Alta' %}selected{% endif %}>Alta</option>
                    <option value="Media" {% if tarea.prioridad == 'Media' %}selected{% endif %}>Media</option>
                    <option value="Baja" {% if tarea.prioridad == 'Baja' %}selected{% endif %}>Baja</option>
                </select>

                <button type="submit">Guardar cambios</button>
            </form>

            <a class="volver" href="{{ url_for('inicio') }}">Volver a mis tareas</a>
        </section>
    </main>

</body>
</html>
